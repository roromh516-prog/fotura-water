name: Extract Project

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -o fotura_android_cloud_ready.zip -d extracted

      - name: List extracted files
        run: |
          echo "=== Extracted project ==="
          find extracted -type f | sort

      - name: Upload extracted project
        uses: actions/upload-artifact@v4
        with:
          name: extracted-project
          path: extracted/
