name: Build New Fotura Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: fotura_new
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle --no-daemon clean :app:assembleDebug

      - name: Check APK
        run: |
          echo "=== APK files ==="
          find fotura_new/app/build/outputs -type f -name "*.apk" -ls

      - name: Create APK ZIP
        run: |
          mkdir -p apk_output
          cp fotura_new/app/build/outputs/apk/debug/app-debug.apk apk_output/نظام-فاتورة.apk
          cd apk_output
          zip -9 نظام-فاتورة-apk.zip نظام-فاتورة.apk
          cd ..
          ls -lh apk_output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: نظام-فاتورة-apk
          path: apk_output/نظام-فاتورة-apk.zip
          if-no-files-found: error
