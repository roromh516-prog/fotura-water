name: Build New Fotura Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create project structure
        run: |
          mkdir -p fotura_new/app/src/main/java/com/example/fotura
          mkdir -p fotura_new/app/src/main/res/values

      - name: Create settings.gradle
        run: |
          cat > fotura_new/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Fotura"
          include(":app")
          EOF

      - name: Create build.gradle
        run: |
          cat > fotura_new/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Create app build.gradle
        run: |
          cat > fotura_new/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.fotura'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.fotura'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

      - name: Create AndroidManifest
        run: |
          cat > fotura_new/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="فوتورا موبايل"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

      - name: Create styles
        run: |
          cat > fotura_new/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0A377D</item>
                  <item name="android:navigationBarColor">#0A377D</item>
              </style>
          </resources>
          EOF

      - name: Create starter MainActivity
        run: |
          cat > fotura_new/app/src/main/java/com/example/fotura/MainActivity.java <<'EOF'
          package com.example.fotura;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  TextView text = new TextView(this);
                  text.setText("فوتورا موبايل");
                  text.setTextSize(28);
                  text.setGravity(17);
                  setContentView(text);
              }
          }
          EOF

      - name: Save project
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add fotura_new
          git commit -m "Create new Fotura project foundation" || true
          git push
