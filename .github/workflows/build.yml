name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          rm -rf fotura_cloud
          unzip -q fotura_android_cloud_ready.zip
          echo "=== Project files ==="
          find fotura_cloud -maxdepth 3 -type f | sort | head -100

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: fotura_cloud
        run: |
          gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK
        run: |
          echo "=== APK files found ==="
          find fotura_cloud/app/build/outputs -type f -name "*.apk" -exec ls -lh {} \;
          echo "=== APK details ==="
          file fotura_cloud/app/build/outputs/apk/debug/app-debug.apk
          test -s fotura_cloud/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: نظام-فاتورة-apk
          path: fotura_cloud/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
